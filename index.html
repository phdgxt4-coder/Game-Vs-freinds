<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Battle Zone — Movement</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1117;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#moveZone{position:fixed;left:0;top:0;width:45%;height:100%;z-index:2}
#lookZone{position:fixed;right:0;top:0;width:55%;height:100%;z-index:2}
#ring{position:fixed;left:0;top:0;width:112px;height:112px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff14;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s;will-change:transform}
#knob{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fffd,#fff6);will-change:transform}
.btn{position:fixed;z-index:4;border:2px solid #ffffff66;border-radius:50%;background:#0b111799;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .08s}
.btn.on{transform:scale(.9);background:#ffffff40}
#jumpBtn{width:84px;height:84px;right:calc(26px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom))}
#crouchBtn{width:62px;height:62px;right:calc(124px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom))}
#camBtn{width:46px;height:46px;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));font-size:20px}
#dbg{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:4;font:600 12px system-ui;direction:rtl;pointer-events:none;text-shadow:0 1px 3px #000}
#rot{position:fixed;inset:0;z-index:9;background:#0b1117;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px}
@media (orientation:portrait){#rot{display:flex}}
#unsup{position:fixed;inset:0;z-index:10;background:#0b1117;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<canvas id="game"></canvas>
<div id="moveZone"></div><div id="lookZone"></div>
<div id="ring"><div id="knob"></div></div>
<button class="btn" id="jumpBtn" aria-label="قفز">⤒</button>
<button class="btn" id="crouchBtn" aria-label="انحناء">⤓</button>
<button class="btn" id="camBtn" aria-label="الكاميرا">🎥</button>
<div id="dbg"></div>
<div id="rot">📱↔️<br>لف الموبايل بالعرض</div>
<div id="unsup">المتصفح قديم — حدّث Chrome أو Safari (16.4 أو أحدث)</div>
<script>if(!(HTMLScriptElement.supports&&HTMLScriptElement.supports('importmap')))document.getElementById('unsup').style.display='flex'</script>
<script type="module" src="./src/main.js"></script>
</body></html>
